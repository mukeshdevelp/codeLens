<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#5b8cff"/>
    </marker>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#121a2f"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17203a"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a45"/>
      <stop offset="100%" stop-color="#151d30"/>
    </linearGradient>
  </defs>

  <rect width="920" height="520" fill="#0b1020"/>
  <text x="460" y="36" text-anchor="middle" fill="#eef2ff" font-size="20" font-weight="700">CodeLens System Architecture</text>

  <!-- Client -->
  <rect x="40" y="70" width="200" height="120" rx="12" fill="url(#clientGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" fill="#5b8cff" font-size="13" font-weight="600">CLIENT</text>
  <rect x="60" y="115" width="160" height="55" rx="8" fill="#243044" stroke="#5b8cff" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" fill="#eef2ff" font-size="14" font-weight="600">React Frontend</text>
  <text x="140" y="158" text-anchor="middle" fill="#9aa8c7" font-size="11">localhost:5173</text>

  <!-- Backend -->
  <rect x="280" y="55" width="360" height="310" rx="14" fill="url(#backendGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="460" y="82" text-anchor="middle" fill="#5b8cff" font-size="13" font-weight="600">FASTAPI BACKEND  localhost:8000</text>

  <rect x="305" y="100" width="145" height="50" rx="8" fill="#243044" stroke="#7c5cff"/>
  <text x="377" y="130" text-anchor="middle" fill="#eef2ff" font-size="13">GitHub OAuth</text>

  <rect x="470" y="100" width="145" height="50" rx="8" fill="#243044" stroke="#7c5cff"/>
  <text x="542" y="130" text-anchor="middle" fill="#eef2ff" font-size="13">REST API</text>

  <rect x="305" y="175" width="145" height="50" rx="8" fill="#243044" stroke="#06d6a0"/>
  <text x="377" y="205" text-anchor="middle" fill="#eef2ff" font-size="13">PR Analyzers</text>

  <rect x="470" y="175" width="145" height="50" rx="8" fill="#243044" stroke="#ffd166"/>
  <text x="542" y="198" text-anchor="middle" fill="#eef2ff" font-size="13">AI Summarizer</text>
  <text x="542" y="214" text-anchor="middle" fill="#9aa8c7" font-size="10">Cursor / OpenAI</text>

  <rect x="388" y="255" width="145" height="50" rx="8" fill="#243044" stroke="#9aa8c7"/>
  <text x="460" y="285" text-anchor="middle" fill="#eef2ff" font-size="13">SQLite DB</text>

  <!-- External -->
  <rect x="680" y="70" width="200" height="200" rx="12" fill="url(#extGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="780" y="100" text-anchor="middle" fill="#5b8cff" font-size="13" font-weight="600">EXTERNAL</text>
  <rect x="700" y="118" width="160" height="40" rx="8" fill="#243044" stroke="#ff6b6b"/>
  <text x="780" y="143" text-anchor="middle" fill="#eef2ff" font-size="12">GitHub API</text>
  <rect x="700" y="170" width="160" height="40" rx="8" fill="#243044" stroke="#ffd166"/>
  <text x="780" y="195" text-anchor="middle" fill="#eef2ff" font-size="12">Cursor API</text>
  <rect x="700" y="222" width="160" height="40" rx="8" fill="#243044" stroke="#06d6a0"/>
  <text x="780" y="247" text-anchor="middle" fill="#eef2ff" font-size="12">OpenAI API</text>

  <!-- Arrows Client -> Backend -->
  <line x1="240" y1="130" x2="300" y2="125" stroke="#5b8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="118" fill="#9aa8c7" font-size="10">/auth, /api</text>
  <line x1="240" y1="155" x2="465" y2="125" stroke="#5b8cff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend internal -->
  <line x1="450" y1="125" x2="470" y2="125" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="542" y1="150" x2="542" y2="172" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="542" y1="150" x2="400" y2="172" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="225" x2="460" y2="252" stroke="#9aa8c7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="377" y1="225" x2="420" y2="252" stroke="#9aa8c7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -> External -->
  <line x1="615" y1="125" x2="695" y2="138" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="615" y1="200" x2="695" y2="190" stroke="#ffd166" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="205" x2="695" y2="242" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="400" width="840" height="95" rx="10" fill="#121a2f" stroke="#2a3654"/>
  <text x="60" y="425" fill="#9aa8c7" font-size="12" font-weight="600">Flow:</text>
  <text x="60" y="448" fill="#eef2ff" font-size="11">1. User logs in via GitHub OAuth ’ session stored in SQLite</text>
  <text x="60" y="468" fill="#eef2ff" font-size="11">2. Frontend lists repos/PRs using user's GitHub token</text>
  <text x="60" y="488" fill="#eef2ff" font-size="11">3. Analyze fetches PR diff ’ runs analyzers ’ optional AI summary ’ caches report</text>
</svg>
