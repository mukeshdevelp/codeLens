<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#5b8cff"/>
    </marker>
    <marker id="arrowIn" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ffd166"/>
    </marker>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2440"/>
      <stop offset="100%" stop-color="#121a2f"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17203a"/>
      <stop offset="100%" stop-color="#0f1628"/>
    </linearGradient>
    <linearGradient id="extGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a45"/>
      <stop offset="100%" stop-color="#151d30"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#0b1020"/>
  <text x="500" y="34" text-anchor="middle" fill="#eef2ff" font-size="20" font-weight="700">CodeLens System Architecture</text>
  <text x="500" y="54" text-anchor="middle" fill="#9aa8c7" font-size="11">FastAPI + React · SQLite (app/db) · Docker / Kubernetes · GitHub App production path</text>

  <!-- GitHub inbound -->
  <rect x="700" y="68" width="260" height="56" rx="10" fill="#1a2440" stroke="#ffd166" stroke-width="1.5"/>
  <text x="830" y="92" text-anchor="middle" fill="#ffd166" font-size="11" font-weight="600">GitHub App webhooks</text>
  <text x="830" y="110" text-anchor="middle" fill="#9aa8c7" font-size="10">POST /webhooks/github · HMAC verified</text>
  <line x1="700" y1="96" x2="620" y2="130" stroke="#ffd166" stroke-width="1.5" marker-end="url(#arrowIn)"/>

  <!-- Client -->
  <rect x="32" y="72" width="220" height="150" rx="12" fill="url(#clientGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="142" y="98" text-anchor="middle" fill="#5b8cff" font-size="12" font-weight="600">CLIENT</text>
  <rect x="52" y="112" width="180" height="48" rx="8" fill="#243044" stroke="#5b8cff"/>
  <text x="142" y="134" text-anchor="middle" fill="#eef2ff" font-size="13" font-weight="600">React + Vite</text>
  <text x="142" y="150" text-anchor="middle" fill="#9aa8c7" font-size="10">Dashboard · PR report · Embed</text>
  <rect x="52" y="168" width="180" height="40" rx="8" fill="#243044" stroke="#7c5cff"/>
  <text x="142" y="188" text-anchor="middle" fill="#eef2ff" font-size="11">nginx proxy (Docker/K8s)</text>
  <text x="142" y="202" text-anchor="middle" fill="#9aa8c7" font-size="9">:5173 dev · :8080 compose</text>

  <!-- Backend -->
  <rect x="280" y="68" width="400" height="380" rx="14" fill="url(#backendGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="480" y="94" text-anchor="middle" fill="#5b8cff" font-size="12" font-weight="600">FASTAPI BACKEND · :8000</text>

  <!-- Routers row -->
  <rect x="300" y="108" width="88" height="40" rx="7" fill="#243044" stroke="#7c5cff"/>
  <text x="344" y="133" text-anchor="middle" fill="#eef2ff" font-size="10">auth</text>
  <rect x="396" y="108" width="88" height="40" rx="7" fill="#243044" stroke="#7c5cff"/>
  <text x="440" y="133" text-anchor="middle" fill="#eef2ff" font-size="10">api</text>
  <rect x="492" y="108" width="88" height="40" rx="7" fill="#243044" stroke="#ffd166"/>
  <text x="536" y="133" text-anchor="middle" fill="#eef2ff" font-size="10">webhooks</text>
  <rect x="588" y="108" width="78" height="40" rx="7" fill="#243044" stroke="#7c5cff"/>
  <text x="627" y="128" text-anchor="middle" fill="#eef2ff" font-size="9">github</text>
  <text x="627" y="140" text-anchor="middle" fill="#eef2ff" font-size="9">integration</text>

  <!-- Pipeline center -->
  <rect x="330" y="168" width="300" height="52" rx="10" fill="#243044" stroke="#06d6a0" stroke-width="2"/>
  <text x="480" y="192" text-anchor="middle" fill="#06d6a0" font-size="12" font-weight="600">analyze_pipeline</text>
  <text x="480" y="210" text-anchor="middle" fill="#9aa8c7" font-size="10">OAuth UI · webhooks · Checks re-sync</text>

  <!-- Analyzers -->
  <rect x="300" y="238" width="130" height="56" rx="8" fill="#243044" stroke="#06d6a0"/>
  <text x="365" y="260" text-anchor="middle" fill="#eef2ff" font-size="11" font-weight="600">engine.py</text>
  <text x="365" y="276" text-anchor="middle" fill="#9aa8c7" font-size="9">6 risk dimensions</text>
  <text x="365" y="288" text-anchor="middle" fill="#9aa8c7" font-size="9">focus + findings</text>

  <rect x="440" y="238" width="130" height="56" rx="8" fill="#243044" stroke="#ffd166"/>
  <text x="505" y="260" text-anchor="middle" fill="#eef2ff" font-size="11" font-weight="600">summarize.py</text>
  <text x="505" y="276" text-anchor="middle" fill="#9aa8c7" font-size="9">PR overview</text>
  <text x="505" y="288" text-anchor="middle" fill="#9aa8c7" font-size="9">per-file + discussion</text>

  <rect x="580" y="238" width="80" height="56" rx="8" fill="#243044" stroke="#7c5cff"/>
  <text x="620" y="260" text-anchor="middle" fill="#eef2ff" font-size="11" font-weight="600">ai.py</text>
  <text x="620" y="278" text-anchor="middle" fill="#9aa8c7" font-size="9">Groq / OpenAI</text>

  <!-- Services -->
  <rect x="300" y="310" width="360" height="56" rx="8" fill="#1a2440" stroke="#2a3654"/>
  <text x="480" y="330" text-anchor="middle" fill="#9aa8c7" font-size="10" font-weight="600">services</text>
  <text x="480" y="348" text-anchor="middle" fill="#eef2ff" font-size="9">github · github_app · checks · pr_comments · commits · discussion · diff</text>
  <text x="480" y="360" text-anchor="middle" fill="#9aa8c7" font-size="9">approve / merge · embed tokens · installations</text>

  <!-- Database -->
  <rect x="340" y="382" width="280" height="52" rx="10" fill="#243044" stroke="#9aa8c7" stroke-width="1.5"/>
  <text x="480" y="406" text-anchor="middle" fill="#eef2ff" font-size="12" font-weight="600">app/db · SQLite</text>
  <text x="480" y="424" text-anchor="middle" fill="#9aa8c7" font-size="9">users · pr_reports · installations · webhook_deliveries · check_runs</text>

  <!-- MCP optional -->
  <rect x="32" y="240" width="220" height="56" rx="10" fill="#121a2f" stroke="#2a3654" stroke-dasharray="5 4"/>
  <text x="142" y="264" text-anchor="middle" fill="#9aa8c7" font-size="11" font-weight="600">MCP server (optional)</text>
  <text x="142" y="282" text-anchor="middle" fill="#9aa8c7" font-size="9">mcp_server.py · Cursor IDE tools</text>

  <!-- External -->
  <rect x="700" y="148" width="260" height="300" rx="12" fill="url(#extGrad)" stroke="#2a3654" stroke-width="2"/>
  <text x="830" y="176" text-anchor="middle" fill="#5b8cff" font-size="12" font-weight="600">EXTERNAL</text>

  <rect x="720" y="192" width="220" height="44" rx="8" fill="#243044" stroke="#ff6b6b"/>
  <text x="830" y="212" text-anchor="middle" fill="#eef2ff" font-size="11" font-weight="600">GitHub REST API</text>
  <text x="830" y="228" text-anchor="middle" fill="#9aa8c7" font-size="9">OAuth token · App installation token</text>

  <rect x="720" y="248" width="220" height="40" rx="8" fill="#243044" stroke="#7c5cff"/>
  <text x="830" y="272" text-anchor="middle" fill="#eef2ff" font-size="11">Groq / OpenAI / OpenRouter</text>

  <rect x="720" y="300" width="220" height="40" rx="8" fill="#243044" stroke="#06d6a0"/>
  <text x="830" y="324" text-anchor="middle" fill="#eef2ff" font-size="11">GitHub Checks + PR comments</text>

  <rect x="720" y="352" width="220" height="40" rx="8" fill="#243044" stroke="#5b8cff"/>
  <text x="830" y="376" text-anchor="middle" fill="#eef2ff" font-size="11">Signed embed on github.com</text>

  <!-- Arrows Client -> Backend -->
  <line x1="252" y1="140" x2="278" y2="140" stroke="#5b8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="130" fill="#9aa8c7" font-size="9">/auth /api</text>

  <!-- Backend -> External -->
  <line x1="680" y1="200" x2="718" y2="210" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="265" x2="718" y2="268" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="320" x2="718" y2="320" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internal router -> pipeline -->
  <line x1="440" y1="148" x2="440" y2="166" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="365" y2="236" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="505" y2="236" stroke="#06d6a0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="620" y2="236" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="294" x2="480" y2="308" stroke="#9aa8c7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="366" x2="480" y2="380" stroke="#9aa8c7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Deploy strip -->
  <rect x="32" y="470" width="936" height="72" rx="12" fill="#121a2f" stroke="#2a3654"/>
  <text x="52" y="496" fill="#5b8cff" font-size="12" font-weight="600">Deploy</text>
  <rect x="52" y="508" width="200" height="26" rx="6" fill="#243044" stroke="#5b8cff"/>
  <text x="152" y="525" text-anchor="middle" fill="#eef2ff" font-size="10">docker-compose.yml</text>
  <rect x="268" y="508" width="200" height="26" rx="6" fill="#243044" stroke="#7c5cff"/>
  <text x="368" y="525" text-anchor="middle" fill="#eef2ff" font-size="10">deploy/kubernetes/</text>
  <text x="500" y="525" fill="#9aa8c7" font-size="10">frontend nginx proxies /auth /api /webhooks to backend</text>

  <!-- Legend -->
  <rect x="32" y="558" width="936" height="68" rx="10" fill="#121a2f" stroke="#2a3654"/>
  <text x="52" y="582" fill="#9aa8c7" font-size="11" font-weight="600">Flows</text>
  <text x="52" y="602" fill="#eef2ff" font-size="10">1. User OAuth login - session in SQLite - list repos/PRs via GitHub token</text>
  <text x="52" y="618" fill="#eef2ff" font-size="10">2. Analyze (manual or webhook) - run_pr_analysis - rules + optional Groq - cache report - optional Checks/comments</text>
  <text x="520" y="602" fill="#eef2ff" font-size="10">3. Review UI - 5 tabs - approve/merge on GitHub</text>
  <text x="520" y="618" fill="#eef2ff" font-size="10">4. Production - GitHub App install - auto-analyze on PR events</text>
</svg>
