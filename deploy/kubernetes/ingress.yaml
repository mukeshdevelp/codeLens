# Requires an Ingress controller (e.g. ingress-nginx).
# Update host and TLS settings for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codelens
  namespace: codelens
  labels:
    app.kubernetes.io/name: codelens
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: codelens.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codelens-frontend
                port:
                  number: 80
  # tls:
