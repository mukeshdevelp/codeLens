apiVersion: apps/v1
kind: Deployment
metadata:
  name: codelens-backend
  namespace: codelens
  labels:
    app.kubernetes.io/name: codelens
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codelens
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codelens
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: codelens-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: codelens-config
            - secretRef:
                name: codelens-secrets
          volumeMounts:
            - name: db-data
              mountPath: /app/app/db
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: codelens-db
